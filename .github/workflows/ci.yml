name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PRs: every push to main gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The Provider tests skip without jq (curl is already on the runner).
      - run: sudo apt-get update && sudo apt-get install -y jq
      - run: go vet ./...
      # -v so a skipped Provider test shows in the log.
      - run: go test -v ./...
      - name: Build the Agent
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -o dist/devcrate-agent-linux-$arch ./cmd/devcrate-agent
          done

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # The harness skips its own build when this tag exists
      # (e2e/harness_test.go tags the image by the Dockerfile's hash).
      - id: vm
        run: echo "tag=devcrate-fake-vm:$(sha256sum e2e/vm/Dockerfile | cut -c1-12)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: e2e/vm
          load: true
          tags: ${{ steps.vm.outputs.tag }}
          cache-from: type=gha,scope=e2e-vm
          cache-to: type=gha,mode=max,scope=e2e-vm
      # Docker Desktop and OrbStack route host.docker.internal to the host's
      # loopback, where the harness's git server and registry mirror listen.
      # Linux Docker routes it to the bridge IP, so forward that to loopback.
      - name: Route host.docker.internal to loopback
        run: |
          sudo sysctl -w net.ipv4.conf.docker0.route_localnet=1
          sudo iptables -t nat -I PREROUTING -i docker0 -d "$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}')" -p tcp -j DNAT --to-destination 127.0.0.1
      - run: go test -tags e2e -timeout 20m ./e2e/
