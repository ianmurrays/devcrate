name: Release

on:
  push:
    tags: ['v*']

jobs:
  homebrew:
    runs-on: ubuntu-latest
    steps:
      # Commits the new url and sha256 straight to the tap's Formula/devcrate.rb.
      # Pinned by SHA: this action gets the tap's write token, and a tag can move.
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2 # v4.2
        with:
          formula-name: devcrate
          homebrew-tap: ianmurrays/homebrew-devcrate
          download-url: https://github.com/ianmurrays/devcrate/archive/refs/tags/${{ github.ref_name }}.tar.gz
          create-pullrequest: false
          create-branch: false
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
